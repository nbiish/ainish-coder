name: Security scans

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Scan tracked content
        run: bash .github/scripts/scan_secrets.sh

  compliance:
    name: PQC and containment gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run compliance gate
        run: python3 bin/security_gate.py .
      - name: Validate shell syntax
        run: find bin scripts src -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [src/cmd-tracker, src/pqc-secrets]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install cargo-audit
        # Pinned, but not to a version that cannot read its own database. 0.21.2 (pinned since this
        # workflow was written) fails on the CURRENT RustSec advisory DB with "TOML parse error" on
        # RUSTSEC-2026-0480 and RUSTSEC-2026-0211 — two separate malformed upstream files. The audit
        # never ran; the job failed on the tool's inability to load its data. 0.23.0 parses both and
        # reports the real result, which is why the failure moved from "always red" to
        # "correctly green" only after the bump.
        run: cargo install cargo-audit --version 0.23.0 --locked
      # cargo-audit fails with exit 1 BOTH for "a dependency has a vulnerability" and for
      # "the advisory database could not be parsed". Those are opposite findings and must not share
      # an exit code: on 2026-11-16 this job failed 14 times in a row because an upstream advisory
      # file (RUSTSEC-2026-0480.md) had malformed TOML, while every dependency here was fine. A gate
      # that cannot tell "your code is unsafe" from "the tool's own data is broken" will be switched
      # off by the first person it annoys, so the two are separated explicitly below.
      - name: Refresh advisory database
        # `--depth 1` on the default branch is the whole DB; the point is to avoid a stale local copy
        # making the audit look clean. A clone failure must be visible rather than silently leaving
        # whatever was cached, which would audit against unknown data.
        run: |
          rm -rf ~/.cargo/advisory-db
          if ! git clone --depth 1 https://github.com/RustSec/advisory-db ~/.cargo/advisory-db; then
            echo "::error::could not clone the RustSec advisory database; an audit against stale or absent data is not meaningful"
            exit 1
          fi
          echo "advisory DB at $(git -C ~/.cargo/advisory-db rev-parse --short HEAD)"
      - name: Audit locked dependencies
        id: audit
        working-directory: ${{ matrix.project }}
        shell: bash
        run: |
          set +e
          cargo audit --json > audit-raw.json 2>audit-err.txt
          rc=$?
          set -e
          cat audit-err.txt >&2 || true
          # The decision lives in a real script, NOT an inline heredoc. The first version of this
          # check was a `python3 - <<'PY'` heredoc inside this YAML block; YAML indents every line of
          # the script, so Python raised IndentationError on line 1, printed nothing, and the shell
          # read that as "unparseable" — which then exited 0. It passed a run while cargo-audit was
          # reporting RUSTSEC-2026-0385 in a cryptography crate. A gate that fails open on its own
          # bugs is worse than no gate.
          python3 "${{ github.workspace }}/.github/scripts/check_cargo_audit.py" audit-raw.json

      - name: Report audit outcome
        if: always()
        run: |
          echo "audit step outcome: ${{ steps.audit.outputs.status }}"
      - name: Upload raw audit output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cargo-audit-${{ strategy.job-index }}
          path: ${{ matrix.project }}/audit-raw.json
          retention-days: 7
          if-no-files-found: ignore
