name: Security scans

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Scan tracked content
        run: bash .github/scripts/scan_secrets.sh

  compliance:
    name: PQC and containment gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run compliance gate
        run: python3 bin/security_gate.py .
      - name: Validate shell syntax
        run: find bin scripts src -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [src/cmd-tracker, src/pqc-secrets]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.21.2 --locked
      # cargo-audit fails with exit 1 BOTH for "a dependency has a vulnerability" and for
      # "the advisory database could not be parsed". Those are opposite findings and must not share
      # an exit code: on 2026-11-16 this job failed 14 times in a row because an upstream advisory
      # file (RUSTSEC-2026-0480.md) had malformed TOML, while every dependency here was fine. A gate
      # that cannot tell "your code is unsafe" from "the tool's own data is broken" will be switched
      # off by the first person it annoys, so the two are separated explicitly below.
      - name: Refresh advisory database
        run: |
          rm -rf ~/.cargo/advisory-db
          git clone --quiet --depth 1 https://github.com/RustSec/advisory-db ~/.cargo/advisory-db
      - name: Audit locked dependencies
        id: audit
        working-directory: ${{ matrix.project }}
        shell: bash
        run: |
          set +e
          out=$(cargo audit --json 2>&1)
          rc=$?
          set -e
          echo "$out" > audit-raw.json
          # A parse/DB failure surfaces as an error string with no vulnerability list. Distinguish it
          # from a genuine finding before deciding anything.
          if grep -qiE 'error loading advisory database|parse error|could not be parsed' <<<"$out"; then
            echo "::warning::cargo-audit could not read the advisory database (upstream data problem, not a finding in this repository)"
            echo "status=tool-error" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          vulns=$(python3 - <<'PY'
          import json, sys
          try:
              d = json.load(open("audit-raw.json"))
          except Exception:
              print("unparseable"); sys.exit(0)
          v = d.get("vulnerabilities") or {}
          found = v.get("found")
          if found is None:
              print("unparseable")
          else:
              print(int(found.get("count", 0)) if isinstance(found, dict) else int(found))
          PY
          )
          case "$vulns" in
            unparseable)
              echo "::warning::cargo-audit emitted output this job could not parse; inspected manually below"
              echo "status=tool-error" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            0)
              echo "status=clean" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            *)
              echo "::error::cargo-audit reports ${vulns} vulnerable dependency/ies in ${{ matrix.project }}"
              echo "status=vulnerable" >> "$GITHUB_OUTPUT"
              exit 1 ;;
          esac
      - name: Report audit outcome
        if: always()
        run: |
          echo "audit step outcome: ${{ steps.audit.outputs.status }}"
      - name: Upload raw audit output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cargo-audit-${{ strategy.job-index }}
          path: ${{ matrix.project }}/audit-raw.json
          retention-days: 7
          if-no-files-found: ignore
