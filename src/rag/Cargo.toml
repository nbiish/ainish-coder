[package]
name = "ainish-rag"
version = "0.1.0"
edition = "2024"
description = "State-of-the-art Multimodal RAG & Codebase Wiki Engine for ainish-coder"

[dependencies]
lancedb = "0.15"
arrow-schema = "53"
arrow-array = "53"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
walkdir = "2"
regex = "1"
chrono = "0.4"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
