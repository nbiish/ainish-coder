[package]
name = "pqc-secrets"
version = "1.2.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.6.0"
base64 = "0.22.1"
chrono = "0.4.44"
fips203 = "0.4.3"
getrandom = "0.4.2"
hex = "0.4.3"
ml-dsa = { version = "0.1.1", features = ["zeroize"] }
ml-kem = { version = "0.3", features = ["zeroize"] }
rpassword = "7.5.4"
security-framework = "3.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha3 = "0.12.0"
zeroize = "1.8.2"
